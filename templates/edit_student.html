{% extends "base.html" %}
{% block title %}Edit Student | CampusDesk{% endblock %}
{% block content %}
<section class="auth-layout single-focus">
  <div class="auth-card wide-card">
    <div class="card-head">
      <span class="eyebrow">Edit Student</span>
      <h2>Edit student details</h2>
      <p>Update the selected record.</p>
    </div>

    <form method="POST" class="auth-form">
      <div class="two-column">
        <div>
          <label>Full Name</label>
          <input type="text" name="full_name" value="{{ student.full_name }}" required />
        </div>
        <div>
          <label>Roll Number</label>
          <input type="text" name="roll_number" value="{{ student.roll_number }}" required />
        </div>
      </div>

      <div class="two-column">
        <div>
          <label>Course</label>
          <input type="text" name="course" value="{{ student.course }}" required />
        </div>
        <div>
          <label>Year / Semester</label>
          <input type="text" name="year_level" value="{{ student.year_level }}" required />
        </div>
      </div>

      <div class="two-column">
        <div>
          <label>Email</label>
          <input type="email" name="email" value="{{ student.email }}" required />
        </div>
        <div>
          <label>Phone</label>
          <input type="text" name="phone" value="{{ student.phone }}" required />
        </div>
      </div>

      <button type="submit" class="btn-primary">Save Student Changes</button>
    </form>

    <div class="helper-links centered-links">
      <a href="{{ url_for('students') }}">Back to student list</a>
    </div>
  </div>
</section>
{% endblock %}
