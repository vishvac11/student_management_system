{% extends "base.html" %}
{% block content %}

<h2>Admin Panel</h2>

<table class="table table-dark">
<tr>
<th>ID</th><th>Name</th><th>Email</th><th>Action</th>
</tr>

{% for u in users %}
<tr>
<td>{{ u.id }}</td>
<td>{{ u.name }}</td>
<td>{{ u.email }}</td>
<td>
<a href="/edit/{{ u.id }}" class="btn btn-warning btn-sm">Edit</a>
<a href="/delete/{{ u.id }}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
{% endfor %}

</table>

{% endblock %}
