{% extends "base.html" %}
{% block title %}Verify Email | CampusDesk{% endblock %}
{% block content %}
<section class="auth-layout single-focus">
  <div class="auth-card">
    <div class="card-head">
      <span class="eyebrow">Verification</span>
      <h2>Activate your account</h2>
      <p>Verify your registered email before login.</p>
    </div>

    <form method="POST" class="auth-form">
      <label>Registered Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />
      <button type="submit" class="btn-primary">Verify Account</button>
    </form>

    <div class="helper-links centered-links">
      <a href="{{ url_for('login') }}">Back to login</a>
    </div>
  </div>
</section>
{% endblock %}
